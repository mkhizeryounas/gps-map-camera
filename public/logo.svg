<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed artwork: the OS applies its own rounded mask. Pin stays inside the maskable safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d27b"/>
      <stop offset="0.55" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#0b6b35"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#35597f"/>
      <stop offset="0.6" stop-color="#13243a"/>
      <stop offset="1" stop-color="#070d17"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3efe7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#053d1d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- faint map roads -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-linecap="round">
    <path d="M-20 360 C 90 330, 150 420, 260 400 S 430 330, 540 370" stroke-width="16"/>
    <path d="M70 -20 C 110 120, 40 220, 120 330 S 150 470, 120 540" stroke-width="10"/>
    <path d="M400 -20 C 380 90, 470 170, 430 290 S 380 450, 420 540" stroke-width="10"/>
    <path d="M-20 140 C 120 160, 200 90, 330 120 S 470 180, 540 150" stroke-width="7"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="256" cy="424" rx="54" ry="12" fill="#04361a" opacity="0.35"/>

  <!-- map pin -->
  <path filter="url(#shadow)" fill="url(#pin)"
        d="M256 420 C 240 392, 190 332, 160 292 A120 120 0 1 1 352 292 C 322 332, 272 392, 256 420 Z"/>

  <!-- camera lens in the pin head -->
  <circle cx="256" cy="220" r="78" fill="#0b3b22"/>
  <circle cx="256" cy="220" r="62" fill="url(#glass)"/>
  <circle cx="256" cy="220" r="62" fill="none" stroke="#22c55e" stroke-width="7"/>
  <circle cx="256" cy="220" r="34" fill="none" stroke="#5b86b3" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="234" cy="197" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="279" cy="244" r="6" fill="#ffffff" opacity="0.35"/>
</svg>
